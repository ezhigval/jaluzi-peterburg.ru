version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jaluzi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jaluzi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jaluzi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-jaluzi_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jaluzi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: jaluzi-backend
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      BACKEND_ENV: ${BACKEND_ENV:-production}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-jaluzi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jaluzi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-jaluzi_db}
      POSTGRES_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: jaluzi-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

